    <circle cx="920" cy="58" r="2"/><circle cx="956" cy="58" r="2"/><circle cx="992" cy="58" r="2"/><circle cx="1028" cy="58" r="2"/><circle cx="1064" cy="58" r="2"/><circle cx="1100" cy="58" r="2"/>
    <circle cx="920" cy="94" r="2"/><circle cx="956" cy="94" r="2"/><circle cx="992" cy="94" r="2"/><circle cx="1028" cy="94" r="2"/><circle cx="1064" cy="94" r="2"/><circle cx="1100" cy="94" r="2"/>
    <circle cx="920" cy="130" r="2"/><circle cx="956" cy="130" r="2"/><circle cx="992" cy="130" r="2"/><circle cx="1028" cy="130" r="2"/><circle cx="1064" cy="130" r="2"/><circle cx="1100" cy="130" r="2"/>
