      <stop offset="50%" stop-color="#111c3a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glow1" cx="18%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
