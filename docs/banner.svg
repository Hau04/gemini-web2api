  <text x="184" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#cbd5e1">Self-hosted OpenAI &amp; Gemini API Gateway for Consumer &amp; Enterprise Web Sessions</text>

