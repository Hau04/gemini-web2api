<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" width="1120" height="390" role="img" aria-label="gemini-web2api architecture diagram">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1120" height="390" rx="16" fill="#0b1120" stroke="#1e293b" stroke-width="1.5"/>
  <text x="32" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Request &amp; Account Isolation Architecture</text>

  <!-- Column 1: Clients -->
  <g transform="translate(32, 66)">
    <rect width="220" height="290" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2"/>
    <text x="18" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">CLIENTS &amp; AGENTS</text>

    <rect x="16" y="48" width="188" height="52" rx="8" fill="#0b1120" stroke="#475569"/>
    <text x="110" y="71" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">OpenAI SDK / Agents</text>
    <text x="110" y="89" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">/v1/chat/completions</text>

    <rect x="16" y="114" width="188" height="52" rx="8" fill="#0b1120" stroke="#475569"/>
    <text x="110" y="137" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Responses &amp; Media</text>
    <text x="110" y="155" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">/v1/responses · /images</text>

    <rect x="16" y="180" width="188" height="52" rx="8" fill="#0b1120" stroke="#475569"/>
    <text x="110" y="203" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Google Gemini SDK</text>
    <text x="110" y="221" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">/v1beta/models/*</text>

    <rect x="16" y="246" width="188" height="32" rx="8" fill="#172554" stroke="#38bdf8" stroke-opacity="0.6"/>
    <text x="110" y="266" text-anchor="middle" font-family="monospace" font-size="11" fill="#bae6fd">Web GUI: GET /ui</text>
  </g>

  <!-- Arrows Col 1 -> Col 2 -->
  <line x1="252" y1="165" x2="304" y2="165" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="252" y1="272" x2="304" y2="272" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Column 2: Router & Isolated Account Instances -->
  <g transform="translate(310, 66)">
    <rect width="390" height="290" rx="12" fill="url(#cardBg)" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.4"/>
    <text x="18" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#818cf8">GEMINI-WEB2API GATEWAY (DOCKER)</text>

    <!-- Default account box -->
    <rect x="16" y="48" width="358" height="64" rx="8" fill="#0b1120" stroke="#34d399" stroke-opacity="0.7"/>
    <text x="30" y="70" font-family="sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">Account: default</text>
    <text x="358" y="70" text-anchor="end" font-family="monospace" font-size="11" fill="#94a3b8">/v1  ·  /v1beta</text>
    <text x="30" y="94" font-family="monospace" font-size="11" fill="#cbd5e1">cookie.json · sessions · bridge hub · templates</text>

    <!-- Account work box -->
    <rect x="16" y="124" width="358" height="64" rx="8" fill="#0b1120" stroke="#38bdf8" stroke-opacity="0.7"/>
    <text x="30" y="146" font-family="sans-serif" font-size="13" font-weight="700" fill="#7dd3fc">Account: work (isolated)</text>
    <text x="358" y="146" text-anchor="end" font-family="monospace" font-size="11" fill="#94a3b8">/a/work/v1</text>
    <text x="30" y="170" font-family="monospace" font-size="11" fill="#cbd5e1">accounts/work/cookie.json · isolated hub</text>

    <!-- Account personal box -->
    <rect x="16" y="200" width="358" height="64" rx="8" fill="#0b1120" stroke="#c084fc" stroke-opacity="0.7"/>
    <text x="30" y="222" font-family="sans-serif" font-size="13" font-weight="700" fill="#e9d5ff">Account: acc2 (isolated)</text>
    <text x="358" y="222" text-anchor="end" font-family="monospace" font-size="11" fill="#94a3b8">/a/acc2/v1</text>
    <text x="30" y="246" font-family="monospace" font-size="11" fill="#cbd5e1">accounts/acc2/cookie.json · isolated hub</text>
  </g>

  <!-- Arrows Col 2 -> Col 3 -->
  <line x1="700" y1="145" x2="756" y2="145" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="700" y1="275" x2="756" y2="275" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Column 3: Upstream Transports -->
  <g transform="translate(762, 66)">
    <rect width="326" height="138" rx="12" fill="url(#cardBg)" stroke="#34d399" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="18" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399">DIRECT COOKIE MODE (PRIMARY)</text>
    <text x="18" y="56" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Browserless server-side RPC / replay</text>
    <text x="18" y="78" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Consumer: gemini.google.com</text>
    <text x="18" y="100" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Enterprise: Discovery Engine streamAssist</text>
    <text x="18" y="122" font-family="sans-serif" font-size="12" fill="#94a3b8">• Context-file uploads &amp; widget JWT auth</text>

    <rect y="154" width="326" height="136" rx="12" fill="url(#cardBg)" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="18" y="184" font-family="sans-serif" font-size="13" font-weight="700" fill="#c4b5fd">LIVE WEB BRIDGE (MV3 EXTENSION)</text>
    <text x="18" y="210" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Auto-syncs cookies &amp; XSRF per account</text>
    <text x="18" y="232" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Network stream hook + Shadow DOM fallback</text>
    <text x="18" y="254" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Handles unmapped picker models &amp; spillover</text>
    <text x="18" y="276" font-family="sans-serif" font-size="12" fill="#94a3b8">• Anti-ban pacing &amp; 429 cooldown protection</text>
  </g>
</svg>
